name: Issues na Discord
on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wyślij issue na forum
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ vars.DISCORD_TAG_ID }}
          ISSUE: ${{ toJson(github.event.issue) }}
        run: |
          NUM=$(jq -r '.number' <<< "$ISSUE")
          TITLE=$(jq -r '.title' <<< "$ISSUE")
          BODY=$(jq -r '.body // ""' <<< "$ISSUE")
          URL=$(jq -r '.html_url' <<< "$ISSUE")
          AUTHOR=$(jq -r '.user.login' <<< "$ISSUE")

          # linki do obrazków z treści (markdown ![](...) i <img src="...">)
          IMGS=$( { grep -oE '!\[[^]]*\]\([^) ]+' <<< "$BODY" | sed -E 's/.*\(//'
                    grep -oiE '<img[^>]+src="[^"]+"' <<< "$BODY" | sed -E 's/.*src="//; s/"$//'; } || true )

          # treść bez znaczników obrazków
          CLEAN=$(sed -E 's/!\[[^]]*\]\([^)]*\)//g; s/<img[^>]*>//g' <<< "$BODY")
          CONTENT="**#$NUM** · 👤 $AUTHOR"$'\n\n'"${CLEAN:0:1700}"$'\n\n'"🔗 $URL"

          # pobranie obrazków jako załączniki (maks. 10)
          DIR=/tmp/issue; mkdir -p "$DIR"
          ARGS=(); i=0
          while read -r img; do
            [ -z "$img" ] || [ $i -ge 10 ] && continue
            curl -sfL -o "$DIR/tmp" "$img" || continue
            MIME=$(file -b --mime-type "$DIR/tmp")
            [[ "$MIME" == image/* ]] || continue
            out="$DIR/obraz$i.${MIME#image/}"
            mv "$DIR/tmp" "$out"
            ARGS+=(-F "files[$i]=@$out"); i=$((i+1))
          done <<< "$IMGS"

          jq -n --arg c "$CONTENT" --arg t "#$NUM $TITLE" --arg tag "$TAG" \
            '{content: $c, thread_name: ($t[0:100])}
             + (if $tag != "" then {applied_tags: [$tag]} else {} end)' > "$DIR/payload.json"
          curl -s --fail-with-body -F "payload_json=<$DIR/payload.json" "${ARGS[@]}" "$WEBHOOK"
